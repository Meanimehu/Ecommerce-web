name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, messages, generated types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:messages
      # Regenerates the request types from the stored OpenAPI description and fails on any difference (D7-02).
      # Noticing a backend change needs a reachable backend (npm run check:types:live); see Document 7, check T7-3.
      - run: npm run check:types
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      BACKEND_URL: http://localhost:3000
      PUBLIC_SITE_URL: https://localhost:3001
      COOKIE_SECRET: ci-only-cookie-secret-ci-only-cookie-secret-0001
      IMAGE_HOST: http://localhost:9002
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      # Login tests need the real backend (E2E_BACKEND_LOG) and are skipped here; they run locally against it.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
