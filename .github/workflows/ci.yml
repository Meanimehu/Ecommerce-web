name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The wider browser set for the tests that need the backend, every night (02:17 India time).
  schedule:
    - cron: '47 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, types, messages, generated types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:messages
      # Regenerates the request types from the stored OpenAPI description and fails on any difference (D7-02).
      # Noticing a backend change needs a reachable backend (npm run check:types:live); see Document 7, check T7-3.
      - run: npm run check:types
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      BACKEND_URL: http://localhost:3000
      PUBLIC_SITE_URL: https://localhost:3001
      COOKIE_SECRET: ci-only-cookie-secret-ci-only-cookie-secret-0001
      IMAGE_HOST: http://localhost:9002
      NEXT_TELEMETRY_DISABLED: '1'
      # The runner has Google Chrome and Microsoft Edge installed; test them too (Document 7, section 11).
      E2E_INSTALLED_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      # The tests that need the backend (E2E_BACKEND_LOG) are skipped here; they run in e2e-backend below.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The tests that need the backend (Document 7, section 11): the backend's main, its database and its sample data,
  # one job per browser. Pull requests: Chromium desktop and phone, WebKit phone. After a merge, every night and by
  # hand: Firefox desktop and phone, WebKit desktop, installed Edge and Chrome.
  e2e-backend:
    name: End-to-end with the backend (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(github.event_name == 'pull_request' && '["chromium-desktop","chromium-phone","webkit-phone"]' || '["firefox-desktop","firefox-phone","webkit-desktop","edge-desktop","chrome-desktop"]') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace_pass
          POSTGRES_DB: marketplace_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      BACKEND_URL: http://localhost:3000
      PUBLIC_SITE_URL: https://localhost:3001
      COOKIE_SECRET: ci-only-cookie-secret-ci-only-cookie-secret-0001
      IMAGE_HOST: http://localhost:9002
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_INSTALLED_BROWSERS: '1'
      E2E_BACKEND_LOG: ${{ github.workspace }}/backend.log
      E2E_DATABASE_URL: postgres://marketplace:marketplace_pass@localhost:5432/marketplace_db
    steps:
      - name: The backend's read-only key is set
        env:
          BACKEND_DEPLOY_KEY: ${{ secrets.BACKEND_DEPLOY_KEY }}
        run: |
          if [ -z "$BACKEND_DEPLOY_KEY" ]; then
            echo "::error::The secret BACKEND_DEPLOY_KEY is missing: a read-only deploy key of Meanimehu/ecommerce (Document 7, section 11)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Meanimehu/ecommerce
          ref: main
          path: backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Backend settings for this run (sample data, mock SMS, photos in memory, no scanning)
        working-directory: backend
        run: |
          cp .env.example .env
          {
            echo "DB_PASSWORD=marketplace_pass"
            echo "DEV_TOOLS_ENABLED=true"
            echo "STORAGE_MODE=memory"
            echo "SCAN_MODE=off"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "OTP_HASH_SECRET=$(openssl rand -hex 32)"
          } >> .env
      - name: Build the backend, create its tables and add the sample data
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm run migrate
          npm run seed:dev
      - name: Start the backend and wait until it answers
        working-directory: backend
        run: |
          (node --env-file=.env dist/main > "$E2E_BACKEND_LOG" 2>&1 &)
          for attempt in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/api/v1/catalogue/categories && exit 0
            sleep 1
          done
          tail -50 "$E2E_BACKEND_LOG"; echo "::error::the backend did not answer on port 3000"; exit 1
      - run: npm ci
      - run: npm run build
      - name: Install the browser for ${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            chromium-*) npx playwright install --with-deps chromium ;;
            firefox-*) npx playwright install --with-deps firefox ;;
            webkit-*) npx playwright install --with-deps webkit ;;
            *) npx playwright install-deps chromium ;;
          esac
      - run: scripts/e2e-with-backend.sh ${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-backend-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            backend.log
          retention-days: 7
