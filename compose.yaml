# The frontend's own shared store for local development (Document 4, D4-10): PostgreSQL in a database used ONLY by the
# frontend. It is a separate service on port 5433, never the backend's database on 5432.
#   docker compose up -d store       then: npm run store:migrate && npm run store:check
services:
  store:
    image: postgres:18
    container_name: dhaaga_web_store
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhaaga_web
      POSTGRES_PASSWORD: dhaaga_web_pass
      POSTGRES_DB: dhaaga_web_store
    # Durability settings the store checklist requires. They are PostgreSQL's defaults, written out so nobody turns them off.
    command: ['postgres', '-c', 'fsync=on', '-c', 'synchronous_commit=on', '-c', 'full_page_writes=on']
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - store_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dhaaga_web -d dhaaga_web_store']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  store_data:
